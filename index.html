<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小五芝麻街英文復習</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React 和 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- 引入 Babel 用於解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f9ff;
        }
        .animate-spin-slow {
            animation: spin 3s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- SVG Icons Components (內建圖示，無需外部依賴) ---
        const IconBase = ({ size = 24, className = "", children }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const Volume2 = (props) => (
            <IconBase {...props}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></IconBase>
        );
        const Star = (props) => (
            <IconBase {...props}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></IconBase>
        );
        const CheckCircle = (props) => (
            <IconBase {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></IconBase>
        );
        const XCircle = (props) => (
            <IconBase {...props}><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></IconBase>
        );
        const Trophy = (props) => (
            <IconBase {...props}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17"></path><path d="M14 14.66V17"></path><path d="M12 2a8 8 0 0 0 8 8c0 1.66-1.5 3-4 3L12 17l-4-4c-2.5 0-4-1.34-4-3a8 8 0 0 0 8-8z"></path><path d="M12 17v5"></path></IconBase>
        );
        const BookOpen = (props) => (
            <IconBase {...props}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></IconBase>
        );
        const Brain = (props) => (
            <IconBase {...props}><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"></path><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"></path></IconBase>
        );
        const LogOut = (props) => (
            <IconBase {...props}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></IconBase>
        );
        const PlayCircle = (props) => (
             <IconBase {...props}><circle cx="12" cy="12" r="10"></circle><polygon points="10 8 16 12 10 16 10 8"></polygon></IconBase>
        );

        // --- 資料設定 (新增 sentence 欄位) ---
        const VOCABULARY = {
            1: [
                { word: 'afraid', zh: '害怕的', type: 'emotion', hint: '🙈 看到鬼會覺得...', icon: '😱', sentence: 'I am afraid of ghosts.' },
                { word: 'fresh', zh: '新鮮的', type: 'state', hint: '🥦 剛採摘的蔬菜', icon: '🥗', sentence: 'The apple is fresh.' },
                { word: 'strange', zh: '奇怪的', type: 'state', hint: '👽 外星人看起來很...', icon: '❓', sentence: 'That is a strange sound.' },
                { word: 'unhealthy', zh: '不健康的', type: 'state', hint: '🍔 每天吃炸雞是...', icon: '🤒', sentence: 'Candy is unhealthy.' },
                { word: 'clever', zh: '聰明的', type: 'personality', hint: '💡 很快想到辦法', icon: '🧠', sentence: 'She is a clever girl.' },
                { word: 'honest', zh: '誠實的', type: 'personality', hint: '🤥 皮諾丘相反詞', icon: '🤝', sentence: 'He is an honest boy.' },
                { word: 'incorrect', zh: '不正確的', type: 'state', hint: '❌ 考卷打叉叉', icon: '❌', sentence: 'The answer is incorrect.' },
                { word: 'dangerous', zh: '危險的', type: 'state', hint: '⚠️ 獅子靠近了！', icon: '🦁', sentence: 'Lions are dangerous.' },
                { word: 'beautiful', zh: '美麗的', type: 'appearance', hint: '🌹 像花一樣', icon: '💃', sentence: 'The flower is beautiful.' },
                { word: 'handsome', zh: '英俊的', type: 'appearance', hint: '🤵 穿西裝的帥哥', icon: '😎', sentence: 'He is a handsome man.' },
            ],
            2: [
                { word: 'vacation', zh: '假期', type: 'noun', hint: '🏖️ 不用上學的日子', icon: '✈️', sentence: 'We go on vacation in summer.' },
                { word: 'machine', zh: '機器', type: 'noun', hint: '🤖 機器人也是一種...', icon: '⚙️', sentence: 'This machine is big.' },
                { word: 'engineer', zh: '工程師', type: 'job', hint: '👷 設計機器的人', icon: '💻', sentence: 'My dad is an engineer.' },
                { word: 'businesswoman', zh: '女商人', type: 'job', hint: '💼 在公司上班的女生', icon: '👩‍💼', sentence: 'She is a businesswoman.' },
                { word: 'surprised', zh: '驚訝的', type: 'emotion', hint: '🎁 收到意外禮物', icon: '😲', sentence: 'I was surprised by the party.' },
                { word: 'helpful', zh: '有幫助的', type: 'personality', hint: '🤝 樂於助人', icon: '🦸', sentence: 'He is helpful at home.' },
                { word: 'important', zh: '重要的', type: 'state', hint: '⭐ 考試必考題', icon: '❗', sentence: 'Water is important.' },
                { word: 'special', zh: '特別的', type: 'state', hint: '🌟 獨一無二', icon: '✨', sentence: 'You are special to me.' },
                { word: 'enough', zh: '足夠的', type: 'state', hint: '🍽️ 吃飽了，不用再多了', icon: '👌', sentence: 'I have enough money.' },
                { word: 'excellent', zh: '優秀的', type: 'state', hint: '💯 考了一百分', icon: '👍', sentence: 'Your work is excellent.' },
            ],
            3: [
                { word: 'celebrate', zh: '慶祝', type: 'verb', hint: '🎂 生日要切蛋糕', icon: '🎉', sentence: "Let's celebrate your birthday." },
                { word: 'medicine', zh: '藥', type: 'noun', hint: '💊 生病要吃...', icon: '🏥', sentence: 'Take this medicine.' },
                { word: 'refrigerator', zh: '冰箱', type: 'noun', hint: '🧊 保存食物的地方', icon: '🥶', sentence: 'Put the milk in the refrigerator.' },
                { word: 'dictionary', zh: '字典', type: 'noun', hint: '📖 查單字的書', icon: '📚', sentence: 'Use a dictionary to find words.' },
                { word: 'believe', zh: '相信', type: 'verb', hint: '🙏 I believe I can fly', icon: '🤞', sentence: 'I believe in you.' },
                { word: 'address', zh: '地址', type: 'noun', hint: '🏠 你家住在哪裡？', icon: '📮', sentence: 'What is your address?' },
                { word: 'weight', zh: '重量', type: 'measure', hint: '⚖️ 站上體重計', icon: '🐘', sentence: 'What is your weight?' },
                { word: 'height', zh: '高度', type: 'measure', hint: '📏 量身高', icon: '🦒', sentence: 'What is your height?' },
                { word: 'centimeter', zh: '公分', type: 'unit', hint: '📏 尺上面的小格子 (cm)', icon: '🤏', sentence: 'The pencil is 10 centimeters.' },
                { word: 'kilogram', zh: '公斤', type: 'unit', hint: '🏋️ 大象很重 (kg)', icon: '⚖️', sentence: 'The dog is 5 kilograms.' },
            ]
        };

        // --- Google Apps Script URL ---
        // 更新為使用者提供的新網址 (2025/01/31 更新)
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyABhjjT0uviY5RFvXrMZPhPVc_oJSMNKihCUJFMZzIYwzXXdI8NfwdRWM1CbOjgPME/exec";

        function App() {
            const [user, setUser] = useState(null); // { name }
            const [view, setView] = useState('login'); // login, menu, learn, game, result
            const [week, setWeek] = useState(1);
            const [gameMode, setGameMode] = useState('quiz'); 
            
            // 遊戲狀態
            const [currentQIndex, setCurrentQIndex] = useState(0);
            const [score, setScore] = useState(0);
            const [questions, setQuestions] = useState([]);
            const [feedback, setFeedback] = useState(null); // 'correct', 'wrong'
            const [isSubmitting, setIsSubmitting] = useState(false);

            // 語音合成
            const speak = (text) => {
                // 停止之前的發音，避免重疊
                window.speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.8;
                window.speechSynthesis.speak(utterance);
            };

            // --- 登入頁面 ---
            const handleLogin = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                setUser({
                name: formData.get('name'),
                });
                setView('menu');
            };

            // --- 數據上傳 ---
            const logDataToSheet = async (resultData) => {
                if (!GOOGLE_SCRIPT_URL) {
                    console.log("模擬上傳數據:", resultData);
                    return;
                }
                
                try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(resultData)
                });
                console.log("數據已發送");
                } catch (error) {
                console.error("上傳失敗", error);
                }
            };

            // --- 遊戲邏輯 ---
            const startGame = (selectedWeek, mode) => {
                setWeek(selectedWeek);
                setGameMode(mode);
                setScore(0);
                setCurrentQIndex(0);
                setFeedback(null);
                
                const words = VOCABULARY[selectedWeek];
                let qList = [];

                if (mode === 'quiz') {
                    // 混合題型
                    qList = words.map(word => {
                        const rand = Math.random();
                        let qType = 'listening';
                        
                        if (rand > 0.66) qType = 'reading_en'; 
                        else if (rand > 0.33) qType = 'reading_zh'; 
                        else qType = 'listening'; 

                        const others = words.filter(w => w.word !== word.word);
                        const distractors = others.sort(() => 0.5 - Math.random()).slice(0, 3);
                        const options = [...distractors, word].sort(() => 0.5 - Math.random());
                        
                        return {
                            type: qType,
                            target: word,
                            options: options
                        };
                    });
                } else if (mode === 'sort') {
                    qList = words.map(word => {
                        const others = words.filter(w => w.word !== word.word);
                        const distractors = others.sort(() => 0.5 - Math.random()).slice(0, 3);
                        const options = [...distractors, word].sort(() => 0.5 - Math.random());
                        return {
                            type: 'matching', 
                            target: word,
                            options: options
                        };
                    });
                }

                // 隨機打亂題目順序
                setQuestions(qList.sort(() => 0.5 - Math.random()));
                setView('game');
            };

            const handleAnswer = (option) => {
                const currentQ = questions[currentQIndex];
                const isCorrect = option.word === currentQ.target.word;
                
                if (isCorrect) {
                    setScore(s => s + 10);
                    setFeedback('correct');
                    speak("Good job!");
                } else {
                    setFeedback('wrong');
                    speak("Try again.");
                }

                logDataToSheet({
                    timestamp: new Date().toISOString(),
                    name: user.name,
                    week: week,
                    word: currentQ.target.word,
                    type: currentQ.type,
                    isCorrect: isCorrect,
                    score: isCorrect ? 10 : 0
                });

                setTimeout(() => {
                    setFeedback(null);
                    if (currentQIndex < questions.length - 1) {
                        setCurrentQIndex(prev => prev + 1);
                    } else {
                        setView('result');
                    }
                }, 1500);
            };

            // --- 畫面渲染組件 ---

            if (view === 'login') {
                return (
                <div className="min-h-screen bg-yellow-100 flex items-center justify-center p-4 font-sans">
                    <div className="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md border-b-8 border-yellow-400">
                    <div className="text-center mb-6">
                        <h1 className="text-3xl font-bold text-blue-600 mb-2">🎈 芝麻街英文挑戰</h1>
                        <p className="text-gray-500">Are you ready?</p>
                    </div>
                    <form onSubmit={handleLogin} className="space-y-4">
                        <div>
                        <label className="block text-gray-700 font-bold mb-1">姓名 Name</label>
                        <input type="text" name="name" required className="w-full p-3 bg-gray-50 rounded-xl border border-gray-200" placeholder="王小明" />
                        </div>
                        <button type="submit" className="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg transform active:scale-95 transition text-xl mt-6">
                        開始 Start! 🚀
                        </button>
                    </form>
                    </div>
                </div>
                );
            }

            if (view === 'menu') {
                return (
                <div className="min-h-screen bg-blue-50 p-4 font-sans">
                    <div className="max-w-4xl mx-auto">
                    <header className="flex justify-between items-center mb-8">
                        <div>
                        <h2 className="text-2xl font-bold text-gray-800">Hi, {user.name} 👋</h2>
                        <p className="text-gray-500">今天想練習哪一週？</p>
                        </div>
                        <button onClick={() => setView('login')} className="text-red-400 hover:bg-red-50 p-2 rounded-lg">
                        <LogOut size={24} />
                        </button>
                    </header>

                    <div className="grid md:grid-cols-3 gap-6 mb-8">
                        {[1, 2, 3].map(w => (
                        <button 
                            key={w}
                            onClick={() => setWeek(w)}
                            className={`p-6 rounded-3xl border-b-8 transition transform active:scale-95 text-left relative overflow-hidden ${
                            week === w ? 'bg-yellow-400 border-yellow-600 ring-4 ring-yellow-200' : 'bg-white border-gray-200 text-gray-400 hover:bg-gray-50'
                            }`}
                        >
                            <div className="relative z-10">
                            <span className="text-sm font-bold uppercase tracking-wider opacity-70">Week</span>
                            <div className="text-4xl font-black">{w}</div>
                            </div>
                            {week === w && <CheckCircle className="absolute top-4 right-4 text-white opacity-50" size={48} />}
                        </button>
                        ))}
                    </div>

                    <div className="grid md:grid-cols-2 gap-6">
                        <div onClick={() => setView('learn')} className="cursor-pointer group bg-white p-6 rounded-3xl shadow-sm border-2 border-transparent hover:border-green-400 transition">
                        <div className="flex items-center gap-4 mb-4">
                            <div className="p-3 bg-green-100 text-green-600 rounded-2xl">
                            <BookOpen size={32} />
                            </div>
                            <div>
                            <h3 className="text-xl font-bold text-gray-800">單字學習 Learn</h3>
                            <p className="text-gray-500 text-sm">發音、聯想、記憶卡</p>
                            </div>
                        </div>
                        <div className="h-2 bg-gray-100 rounded-full overflow-hidden">
                            <div className="h-full bg-green-400 w-2/3"></div>
                        </div>
                        </div>

                        <div onClick={() => startGame(week, 'quiz')} className="cursor-pointer group bg-white p-6 rounded-3xl shadow-sm border-2 border-transparent hover:border-purple-400 transition">
                        <div className="flex items-center gap-4 mb-4">
                            <div className="p-3 bg-purple-100 text-purple-600 rounded-2xl">
                            <Trophy size={32} />
                            </div>
                            <div>
                            <h3 className="text-xl font-bold text-gray-800">闖關挑戰 Game</h3>
                            <p className="text-gray-500 text-sm">聽力、配對、拿高分</p>
                            </div>
                        </div>
                        <div className="h-2 bg-gray-100 rounded-full overflow-hidden">
                            <div className="h-full bg-purple-400 w-1/3"></div>
                        </div>
                        </div>
                    </div>
                    </div>
                </div>
                );
            }

            if (view === 'learn') {
                const words = VOCABULARY[week];
                return (
                <div className="min-h-screen bg-green-50 p-4 flex flex-col items-center">
                    <header className="w-full max-w-2xl flex justify-between items-center mb-6">
                    <button onClick={() => setView('menu')} className="text-gray-500 font-bold hover:text-gray-700">← Back</button>
                    <div className="font-bold text-green-700 bg-green-200 px-4 py-1 rounded-full">Week {week} Words</div>
                    </header>

                    <div className="w-full max-w-2xl grid gap-4 pb-20">
                    {words.map((item, idx) => (
                        <div key={idx} className="bg-white p-6 rounded-2xl shadow-sm flex flex-col md:flex-row items-start md:items-center justify-between border-b-4 border-gray-100 hover:border-green-300 transition gap-4">
                            <div className="flex items-center gap-4 w-full md:w-auto">
                                {/* 修改：加大 Icon 尺寸 text-4xl -> text-6xl */}
                                <div className="text-6xl bg-gray-50 p-4 rounded-2xl">{item.icon}</div>
                                <div>
                                    <h3 className="text-2xl font-bold text-gray-800">{item.word}</h3>
                                    <p className="text-gray-500 font-medium mb-1">{item.zh}</p>
                                    
                                    {/* 新增：例句顯示區域 */}
                                    <div className="flex items-center gap-2 mt-2 bg-green-50 px-3 py-2 rounded-lg cursor-pointer hover:bg-green-100 transition" onClick={() => speak(item.sentence)}>
                                        <div className="text-green-600">
                                            <PlayCircle size={16} />
                                        </div>
                                        <p className="text-sm text-green-800 italic font-medium">{item.sentence}</p>
                                    </div>
                                </div>
                            </div>
                            
                            <div className="flex flex-row md:flex-col items-center md:items-end gap-2 w-full md:w-auto justify-end">
                                <button 
                                    onClick={() => speak(item.word)} 
                                    className="bg-blue-100 hover:bg-blue-200 text-blue-600 p-3 rounded-full transition flex items-center gap-2"
                                >
                                    <Volume2 size={24} />
                                    <span className="md:hidden text-sm font-bold">單字</span>
                                </button>
                                <span className="text-xs bg-yellow-100 text-yellow-800 px-2 py-1 rounded-md">{item.hint}</span>
                            </div>
                        </div>
                    ))}
                    </div>
                </div>
                );
            }

            if (view === 'game') {
                const currentQ = questions[currentQIndex];
                const progress = ((currentQIndex) / questions.length) * 100;
                
                const isReadingZh = currentQ.type === 'reading_zh';

                return (
                <div className="min-h-screen bg-purple-50 p-4 flex flex-col items-center justify-center font-sans">
                    <div className="w-full max-w-xl mb-8">
                    <div className="flex justify-between text-gray-600 font-bold mb-2">
                        <span>Question {currentQIndex + 1}/{questions.length}</span>
                        <span>Score: {score}</span>
                    </div>
                    <div className="h-4 bg-white rounded-full overflow-hidden shadow-inner">
                        <div className="h-full bg-purple-500 transition-all duration-500" style={{ width: `${progress}%` }}></div>
                    </div>
                    </div>

                    <div className="bg-white rounded-3xl shadow-xl w-full max-w-xl p-8 text-center relative border-b-8 border-purple-200">
                        {/* 題目區 */}
                        <div className="mb-8">
                        {currentQ.type === 'listening' ? (
                            <div className="py-8">
                            <button 
                                onClick={() => speak(currentQ.target.word)} 
                                className="bg-blue-500 hover:bg-blue-600 text-white p-6 rounded-full shadow-lg animate-bounce"
                            >
                                <Volume2 size={48} />
                            </button>
                            <p className="mt-4 text-gray-500">點擊播放聲音</p>
                            </div>
                        ) : (
                            <div className="py-8">
                            <div className="text-5xl font-black text-gray-800 mb-2">
                                {isReadingZh ? currentQ.target.zh : currentQ.target.word}
                            </div>
                            <div className="text-gray-400 text-sm bg-gray-100 inline-block px-3 py-1 rounded-full">
                                {currentQ.target.icon} {currentQ.target.type}
                            </div>
                            </div>
                        )}
                        </div>

                        {/* 選項區 */}
                        <div className="grid grid-cols-2 gap-4">
                        {currentQ.options.map((opt, idx) => (
                            <button
                            key={idx}
                            disabled={feedback !== null}
                            onClick={() => handleAnswer(opt)}
                            className={`p-4 rounded-xl text-lg font-bold border-b-4 transition transform active:scale-95 flex flex-col items-center justify-center min-h-[100px] ${
                                feedback === 'correct' && opt.word === currentQ.target.word 
                                ? 'bg-green-500 border-green-700 text-white' 
                                : feedback === 'wrong' && opt.word === currentQ.target.word
                                    ? 'bg-green-100 border-green-300 text-green-800' 
                                    : 'bg-gray-50 border-gray-200 text-gray-700 hover:bg-purple-50 hover:border-purple-200'
                            }`}
                            >
                            <span className="text-xl">
                                {isReadingZh ? opt.word : opt.zh}
                            </span>
                            </button>
                        ))}
                        </div>

                        {/* 回饋遮罩 */}
                        {feedback && (
                        <div className="absolute inset-0 rounded-3xl bg-white/90 backdrop-blur-sm flex items-center justify-center flex-col z-20">
                            {feedback === 'correct' ? (
                            <>
                                <CheckCircle size={80} className="text-green-500 mb-4" />
                                <h2 className="text-3xl font-black text-green-600">Correct! 🎉</h2>
                            </>
                            ) : (
                            <>
                                <XCircle size={80} className="text-red-500 mb-4" />
                                <h2 className="text-3xl font-black text-red-600">Oops! 😅</h2>
                                <p className="text-gray-500 mt-2 font-bold text-xl">
                                    {currentQ.target.word} <br/> {currentQ.target.zh}
                                </p>
                            </>
                            )}
                        </div>
                        )}
                    </div>
                </div>
                );
            }

            if (view === 'result') {
                const isPass = score >= 60;
                return (
                <div className="min-h-screen bg-yellow-400 p-4 flex flex-col items-center justify-center font-sans">
                    <div className="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md text-center">
                    <div className="mb-6 flex justify-center">
                        {isPass ? <Star size={80} className="text-yellow-400 fill-current animate-spin-slow" /> : <Brain size={80} className="text-gray-400" />}
                    </div>
                    
                    <h2 className="text-4xl font-black text-gray-800 mb-2">{isPass ? 'Awesome!' : 'Good Try!'}</h2>
                    <p className="text-gray-500 mb-8">Week {week} Challenge Complete</p>

                    <div className="bg-gray-50 rounded-2xl p-6 mb-8">
                        <div className="text-sm text-gray-400 uppercase tracking-widest">Total Score</div>
                        <div className="text-6xl font-black text-blue-600">{score}</div>
                    </div>

                    <button 
                        onClick={() => setView('menu')}
                        className="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg border-b-4 border-blue-700 active:border-b-0 active:mt-1"
                    >
                        Play Again / Back to Menu
                    </button>
                    
                    <div className="mt-4 text-xs text-gray-400">
                        {GOOGLE_SCRIPT_URL ? "✅ 成績已上傳" : "⚠️ 未設定 Google Script URL"}
                    </div>
                    </div>
                </div>
                );
            }

            return <div>Loading...</div>;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
